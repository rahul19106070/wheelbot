<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Wheel Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <div class="user-info">
          <div class="avatar" id="userAvatar">U</div>
          <div class="user-details">
            <span class="username" id="userName">User</span>
            <span class="userid" id="userId">ID: 000000</span>
          </div>
        </div>
        <div class="resources">
          <div class="resource-badge energy">⚡ <span id="energyCount">5</span></div>
          <div class="resource-badge coins">💰 <span id="coinCount">0.00</span></div>
          <div class="resource-badge diamonds">💎 <span id="diamondCount">0</span></div>
        </div>
      </header>

      <main class="main-stage">
        
        <div class="balance-display">
          <h2>💰 $<span id="mainBalance">0.46</span></h2>
        </div>

        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress-fill" style="width: 46%"></div>
          </div>
          <p class="progress-text">Only $0.54 to cash out $1!</p>
        </div>

        <div class="wheel-container">
          <div class="wheel-arrow">▼</div>
          <div class="wheel" id="wheel">
            <!-- Wheel segments generated via JS -->
          </div>
          <button class="spin-btn" id="spinBtn">
            <span class="spin-text">SPIN FOR 1</span>
            <span class="spin-icon">⚡</span>
          </button>
        </div>

        <div class="side-actions">
          <button class="action-btn">
            <span class="icon">➕</span>
            <span class="label">+Spins</span>
          </button>
          <button class="action-btn">
            <span class="icon">📅</span>
            <span class="label">Sign In</span>
          </button>
          <button class="action-btn">
            <span class="icon">💳</span>
            <span class="label">Wallet</span>
          </button>
        </div>
      </main>

      <footer class="bottom-bar">
        <button class="invite-btn" id="inviteBtn">
          🎉 Invite for Spins!
        </button>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
