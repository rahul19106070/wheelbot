<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Wheel Earn</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <!-- MAIN PAGE -->
      <div id="main-page">
        <header class="top-bar">
          <div class="user-info">
            <div class="avatar" id="userAvatar">U</div>
            <div class="user-details">
              <span class="username" id="userName">User</span>
              <span class="userid" id="userId">ID: 000000</span>
            </div>
          </div>
          <div class="resources">
            <div class="resource-badge energy">⚡ <span>0</span></div>
            <div class="resource-badge spins">🎡 <span id="energyCountHeader">1</span></div>
            <div class="resource-badge diamonds">💎 <span>0</span></div>
          </div>
        </header>

        <main class="main-stage">
          
          <div class="balance-display">
            <h2>🪙 $<span id="mainBalance">0.00</span></h2>
          </div>

          <div class="progress-container">
            <div class="progress-bar">
              <div class="progress-fill" style="width: 0%"></div>
            </div>
            <p class="progress-text">Only $1.00 to cash out $1!</p>
          </div>

          <div class="wheel-container">
            <div class="wheel-arrow">▼</div>
            <div class="wheel-border">
              <div class="wheel" id="wheel">
                <!-- Wheel segments generated via JS -->
              </div>
            </div>
            <button class="spin-btn" id="spinBtn">
              <span class="spin-text">SPIN FOR 1</span>
              <span class="spin-icon">🎡</span>
            </button>
          </div>

          <!-- Left Actions -->
          <div class="side-actions left-actions">
            <button class="action-btn">
              <div class="icon-box">🎟️</div>
              <span class="label">Raffle</span>
            </button>
            <button class="action-btn">
              <div class="icon-box">🏆</div>
              <span class="label">Contest</span>
            </button>
            <button class="action-btn">
              <div class="icon-box">🎁</div>
              <span class="label">Gift</span>
            </button>
            <button class="action-btn">
              <div class="icon-box">👥</div>
              <span class="label">Team</span>
            </button>
          </div>

          <!-- Right Actions -->
          <div class="side-actions right-actions">
            <button class="action-btn">
              <div class="icon-box">🎡</div>
              <span class="label">+Spins</span>
            </button>
            <button class="action-btn">
              <div class="icon-box">📅</div>
              <span class="label">Sign In</span>
            </button>
            <button class="action-btn" id="openWalletBtn">
              <div class="icon-box">💰</div>
              <span class="label">Wallet</span>
            </button>
          </div>
        </main>

        <footer class="bottom-bar">
          <button class="invite-btn" id="inviteBtn">
            🎟 Invite for Spins!
          </button>
        </footer>
      </div>

      <!-- Win Modal Overlay -->
      <div id="winModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
          <h2 class="modal-title">Congratulations!</h2>
          <img src="/assets/3d_gold_coin_1786024703243.jpg" class="modal-image" alt="Win Image" id="modalImage">
          <h1 class="modal-amount" id="modalAmount">$0.00</h1>
          <button class="modal-btn" id="modalGoOnBtn">GO ON!</button>
        </div>
      </div>

      <!-- WALLET PAGE -->
      <div id="wallet-page" style="display: none;">
        <header class="wallet-header">
          <button class="back-btn" id="backToMainBtn">&lt; Back</button>
          <div class="resources">
            <div class="resource-badge energy">⚡ <span id="walletEnergyCount">1</span></div>
            <div class="resource-badge diamonds">💎 <span id="walletDiamondCount">0</span></div>
          </div>
        </header>

        <div class="wallet-balance-box">
          <span class="wallet-balance-title">Balance</span>
          <span class="wallet-balance-amount">$ <span id="walletBalance">0.00</span></span>
        </div>

        <div class="wallet-list-box">
          <h3>Wallets</h3>
          
          <div class="wallet-item">
            <div class="wallet-item-header">
              <span class="badge">Crypto Wallet</span>
              <button class="connect-btn">Connect</button>
            </div>
            <p class="wallet-status">Not connected</p>
          </div>

          <div class="wallet-item">
            <div class="wallet-item-header">
              <span class="badge">UPI / Fiat Wallet</span>
              <button class="connect-btn" id="addUpiBtn">Add</button>
            </div>
            <p class="wallet-status" id="upiStatusText">No fiat wallet added</p>
          </div>
        </div>

        <div class="wallet-links">
          <button class="link-btn">Records</button>
          <button class="link-btn">Feedback</button>
        </div>

        <p class="fee-text">Transaction fee ranges from 1% to 15%.</p>

        <button class="withdraw-btn">Select a wallet to withdraw</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
